<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Across Health Professions Training: Exposure, Evidence & Safe-Use Questions</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#f9f8f6;color:#1a1a1a;display:grid;place-items:center;min-height:100vh}.loading{max-width:640px;padding:28px;background:#fff;border:1px solid #e2e0db;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.06)}.loading h1{font-size:20px;margin:0 0 8px}.loading p{font-size:14px;color:#555;margin:0}
</style>
</head>
<body>
<div class="loading"><h1>Loading resource</h1><p>If this page does not load, please refresh once.</p></div>
<script>
(async function(){
  try {
    const files = ['payload-1.txt','payload-2.txt','payload-3.txt'];
    const b64 = (await Promise.all(files.map(f => fetch(f, {cache:'no-store'}).then(r => r.text())))).join('').replace(/\s+/g,'');
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (error) {
    document.body.innerHTML = '<div class="loading"><h1>Unable to load resource</h1><p>Please use a current browser and refresh this page. If the issue persists, contact rparag@lsuhsc.edu.</p></div>';
    console.error(error);
  }
})();
</script>
</body>
</html>

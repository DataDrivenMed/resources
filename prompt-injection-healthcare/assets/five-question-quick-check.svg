<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Five-question quick check</title><desc id="desc">A five-item checklist covering approval, untrusted content, sensitivity, broad access, and external actions.</desc>
<rect width="1200" height="520" rx="28" fill="#F5F9FA"/>
<text x="60" y="62" font-family="Arial" font-size="27" font-weight="700" fill="#071827">Five-question quick check</text>
<rect x="65" y="112" width="46" height="46" rx="10" fill="#FFFFFF" stroke="#18B7B2" stroke-width="3"/><path d="M79 135l9 9 17-20" stroke="#18B7B2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="143" font-family="Arial" font-size="19" fill="#152637">Is the exact tool and feature approved here?</text>
<rect x="65" y="181" width="46" height="46" rx="10" fill="#FFFFFF" stroke="#18B7B2" stroke-width="3"/><path d="M79 204l9 9 17-20" stroke="#18B7B2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="212" font-family="Arial" font-size="19" fill="#152637">Is the AI reading content someone else could alter?</text>
<rect x="65" y="250" width="46" height="46" rx="10" fill="#FFFFFF" stroke="#18B7B2" stroke-width="3"/><path d="M79 273l9 9 17-20" stroke="#18B7B2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="281" font-family="Arial" font-size="19" fill="#152637">Does the task involve sensitive or strategic information?</text>
<rect x="65" y="319" width="46" height="46" rx="10" fill="#FFFFFF" stroke="#18B7B2" stroke-width="3"/><path d="M79 342l9 9 17-20" stroke="#18B7B2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="350" font-family="Arial" font-size="19" fill="#152637">Can the AI reach more data than this task needs?</text>
<rect x="65" y="388" width="46" height="46" rx="10" fill="#FFFFFF" stroke="#18B7B2" stroke-width="3"/><path d="M79 411l9 9 17-20" stroke="#18B7B2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="419" font-family="Arial" font-size="19" fill="#152637">Can it send, upload, change, document, or trigger anything?</text>
<rect x="65" y="455" width="1070" height="1" fill="#C7D8E0"/><text x="65" y="490" font-family="Arial" font-size="16" fill="#607487">Several “yes” answers call for stronger controls, narrower access, and explicit human approval.</text>
</svg>

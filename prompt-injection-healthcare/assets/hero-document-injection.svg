<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">AI reading an outside healthcare document containing an untrusted instruction</title><desc id="desc">A clinical document contains a highlighted untrusted line that enters the AI working context.</desc>
<rect width="1200" height="520" rx="28" fill="#F5F9FA"/>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00111f" flood-opacity=".18"/></filter></defs>
<rect x="65" y="62" width="430" height="390" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
<rect x="98" y="98" width="210" height="18" rx="9" fill="#18B7B2" opacity=".95"/>
<rect x="98" y="140" width="350" height="12" rx="6" fill="#BDD0D9"/>
<rect x="98" y="168" width="322" height="12" rx="6" fill="#D7E3E8"/>
<rect x="98" y="196" width="338" height="12" rx="6" fill="#D7E3E8"/>
<rect x="86" y="235" width="386" height="86" rx="14" fill="#FFF3DE" stroke="#F3B84B" stroke-width="3"/>
<circle cx="118" cy="278" r="17" fill="#F3B84B"/><text x="112" y="285" font-size="22" font-weight="700" fill="#071827">!</text>
<text x="150" y="265" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#152637">Untrusted instruction inside content</text>
<text x="150" y="293" font-size="15" font-family="Arial, sans-serif" fill="#607487">The user asked for a summary, not a new task.</text>
<rect x="98" y="350" width="344" height="12" rx="6" fill="#D7E3E8"/>
<rect x="98" y="378" width="286" height="12" rx="6" fill="#D7E3E8"/>
<path d="M525 255 C585 255 592 255 638 255" stroke="#18B7B2" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#18B7B2"/></marker></defs>
<rect x="655" y="85" width="460" height="350" rx="30" fill="#0B2742" filter="url(#shadow)"/>
<circle cx="885" cy="176" r="62" fill="#18B7B2" opacity=".18"/><circle cx="885" cy="176" r="37" fill="none" stroke="#8BE3DE" stroke-width="6"/><path d="M865 176h40M885 156v40" stroke="#8BE3DE" stroke-width="5" stroke-linecap="round"/>
<text x="780" y="270" font-size="25" font-family="Arial, sans-serif" font-weight="700" fill="#FFFFFF">AI working context</text>
<text x="738" y="305" font-size="16" font-family="Arial, sans-serif" fill="#C7DFEA">User request + document + retrieved data</text>
<rect x="727" y="343" width="316" height="48" rx="24" fill="#173C57" stroke="#18B7B2" stroke-width="2"/>
<text x="772" y="374" font-size="17" font-family="Arial, sans-serif" font-weight="700" fill="#FFFFFF">Which words are instructions?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">PAUSE framework</title><desc id="desc">Five cards for Permissions, Approved tool, Untrusted content, Sensitive information, and External action.</desc>
<rect width="1200" height="520" rx="28" fill="#F5F9FA"/>
<text x="60" y="62" font-family="Arial" font-size="26" font-weight="700" fill="#071827">PAUSE before using AI</text>
<rect x="45" y="105" width="200" height="320" rx="24" fill="#FFFFFF" stroke="#18B7B2" stroke-width="3"/><circle cx="145" cy="175" r="44" fill="#18B7B2"/><text x="130" y="188" font-family="Arial" font-size="38" font-weight="800" fill="#071827">P</text><text x="65" y="255" font-family="Arial" font-size="20" font-weight="700" fill="#071827">Permissions</text><text x="65" y="300" font-family="Arial" font-size="15" fill="#607487">What data, tools, and</text><text x="65" y="326" font-family="Arial" font-size="15" fill="#607487">actions can it reach?</text>
<rect x="275" y="105" width="200" height="320" rx="24" fill="#FFFFFF" stroke="#4D8DFF" stroke-width="3"/><circle cx="375" cy="175" r="44" fill="#4D8DFF"/><text x="360" y="188" font-family="Arial" font-size="38" font-weight="800" fill="#071827">A</text><text x="295" y="255" font-family="Arial" font-size="20" font-weight="700" fill="#071827">Approved tool</text><text x="295" y="300" font-family="Arial" font-size="15" fill="#607487">Exact product, account,</text><text x="295" y="326" font-family="Arial" font-size="15" fill="#607487">feature, and workflow?</text>
<rect x="505" y="105" width="200" height="320" rx="24" fill="#FFFFFF" stroke="#F3B84B" stroke-width="3"/><circle cx="605" cy="175" r="44" fill="#F3B84B"/><text x="590" y="188" font-family="Arial" font-size="38" font-weight="800" fill="#071827">U</text><text x="525" y="255" font-family="Arial" font-size="20" font-weight="700" fill="#071827">Untrusted content</text><text x="525" y="300" font-family="Arial" font-size="15" fill="#607487">Could another person</text><text x="525" y="326" font-family="Arial" font-size="15" fill="#607487">have manipulated the</text><text x="525" y="352" font-family="Arial" font-size="15" fill="#607487">input?</text>
<rect x="735" y="105" width="200" height="320" rx="24" fill="#FFFFFF" stroke="#D65B5B" stroke-width="3"/><circle cx="835" cy="175" r="44" fill="#D65B5B"/><text x="820" y="188" font-family="Arial" font-size="38" font-weight="800" fill="#FFFFFF">S</text><text x="755" y="255" font-family="Arial" font-size="20" font-weight="700" fill="#071827">Sensitive information</text><text x="755" y="300" font-family="Arial" font-size="15" fill="#607487">PHI, research,</text><text x="755" y="326" font-family="Arial" font-size="15" fill="#607487">credentials, plans,</text><text x="755" y="352" font-family="Arial" font-size="15" fill="#607487">people?</text>
<rect x="965" y="105" width="200" height="320" rx="24" fill="#FFFFFF" stroke="#18B7B2" stroke-width="3"/><circle cx="1065" cy="175" r="44" fill="#18B7B2"/><text x="1050" y="188" font-family="Arial" font-size="38" font-weight="800" fill="#071827">E</text><text x="985" y="255" font-family="Arial" font-size="20" font-weight="700" fill="#071827">External action</text><text x="985" y="300" font-family="Arial" font-size="15" fill="#607487">Can it send, upload,</text><text x="985" y="326" font-family="Arial" font-size="15" fill="#607487">change, retain, or</text><text x="985" y="352" font-family="Arial" font-size="15" fill="#607487">trigger?</text><text x="60" y="480" font-family="Arial" font-size="16" fill="#607487">PAUSE is an educational framework created for this resource, not a regulation or validated external standard.</text>
</svg>

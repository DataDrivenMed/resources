<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Prompt injection pathway</title><desc id="desc">Five steps from a legitimate user task through untrusted content to a changed response or action.</desc>
<rect width="1200" height="510" rx="28" fill="#F5F9FA"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#18B7B2"/></marker></defs>
<text x="60" y="66" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#071827">How indirect prompt injection moves through a workflow</text>
<rect x="45" y="115" width="195" height="275" rx="20" fill="#FFFFFF" stroke="#C8D8E0" stroke-width="2"/><circle cx="83" cy="155" r="22" fill="#18B7B2"/><text x="76" y="163" font-size="22" font-family="Arial" font-weight="700" fill="#071827">1</text><text x="67" y="212" font-size="19" font-family="Arial" font-weight="700" fill="#152637">Legitimate user task</text><text x="67" y="255" font-size="15" font-family="Arial" fill="#607487">Summarize this outside</text><text x="67" y="282" font-size="15" font-family="Arial" fill="#607487">report</text><path d="M243 252 H270" stroke="#18B7B2" stroke-width="5" marker-end="url(#a)"/>
<rect x="275" y="115" width="195" height="275" rx="20" fill="#FFFFFF" stroke="#C8D8E0" stroke-width="2"/><circle cx="313" cy="155" r="22" fill="#18B7B2"/><text x="306" y="163" font-size="22" font-family="Arial" font-weight="700" fill="#071827">2</text><text x="297" y="212" font-size="19" font-family="Arial" font-weight="700" fill="#152637">Untrusted content</text><text x="297" y="255" font-size="15" font-family="Arial" fill="#607487">PDF, email, webpage,</text><text x="297" y="282" font-size="15" font-family="Arial" fill="#607487">image, record</text><path d="M473 252 H500" stroke="#18B7B2" stroke-width="5" marker-end="url(#a)"/>
<rect x="505" y="115" width="195" height="275" rx="20" fill="#FFFFFF" stroke="#C8D8E0" stroke-width="2"/><circle cx="543" cy="155" r="22" fill="#18B7B2"/><text x="536" y="163" font-size="22" font-family="Arial" font-weight="700" fill="#071827">3</text><text x="527" y="212" font-size="19" font-family="Arial" font-weight="700" fill="#152637">Embedded instruction</text><text x="527" y="255" font-size="15" font-family="Arial" fill="#607487">Content tells the AI to</text><text x="527" y="282" font-size="15" font-family="Arial" fill="#607487">change course</text><path d="M703 252 H730" stroke="#18B7B2" stroke-width="5" marker-end="url(#a)"/>
<rect x="735" y="115" width="195" height="275" rx="20" fill="#FFFFFF" stroke="#C8D8E0" stroke-width="2"/><circle cx="773" cy="155" r="22" fill="#18B7B2"/><text x="766" y="163" font-size="22" font-family="Arial" font-weight="700" fill="#071827">4</text><text x="757" y="212" font-size="19" font-family="Arial" font-weight="700" fill="#152637">AI behavior changes</text><text x="757" y="255" font-size="15" font-family="Arial" fill="#607487">Different output,</text><text x="757" y="282" font-size="15" font-family="Arial" fill="#607487">retrieval, or tool call</text><path d="M933 252 H960" stroke="#18B7B2" stroke-width="5" marker-end="url(#a)"/>
<rect x="965" y="115" width="195" height="275" rx="20" fill="#FFFFFF" stroke="#C8D8E0" stroke-width="2"/><circle cx="1003" cy="155" r="22" fill="#18B7B2"/><text x="996" y="163" font-size="22" font-family="Arial" font-weight="700" fill="#071827">5</text><text x="987" y="212" font-size="19" font-family="Arial" font-weight="700" fill="#152637">Possible consequence</text><text x="987" y="255" font-size="15" font-family="Arial" fill="#607487">Distortion, disclosure,</text><text x="987" y="282" font-size="15" font-family="Arial" fill="#607487">or unintended action</text><text x="60" y="465" font-family="Arial" font-size="17" fill="#607487">The final effect is limited by the system’s actual data access, permissions, tools, and autonomy.</text>
</svg>

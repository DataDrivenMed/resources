<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Risk escalation graphic</title><desc id="desc">Five stages from standalone chatbot to more autonomous agent, with increasing potential consequence.</desc>
<rect width="1200" height="510" rx="28" fill="#F5F9FA"/>
<defs><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18B7B2"/></marker></defs>
<text x="60" y="64" font-family="Arial" font-size="26" font-weight="700" fill="#071827">Risk escalation follows capability</text>
<rect x="45" y="240" width="200" height="150" rx="22" fill="#E9F7F6" stroke="#18B7B2" stroke-width="3"/><text x="63" y="282" font-family="Arial" font-size="19" font-weight="700" fill="#071827">Chatbot</text><text x="63" y="318" font-family="Arial" font-size="15" fill="#607487">Manipulated text</text><path d="M248 410 H270" stroke="#18B7B2" stroke-width="5" marker-end="url(#r)"/>
<rect x="275" y="202" width="200" height="188" rx="22" fill="#DDF1F5" stroke="#55AFC4" stroke-width="3"/><text x="293" y="244" font-family="Arial" font-size="19" font-weight="700" fill="#071827">Uploaded files</text><text x="293" y="280" font-family="Arial" font-size="15" fill="#607487">File misuse or</text><text x="293" y="305" font-family="Arial" font-size="15" fill="#607487">exposure</text><path d="M478 410 H500" stroke="#18B7B2" stroke-width="5" marker-end="url(#r)"/>
<rect x="505" y="164" width="200" height="226" rx="22" fill="#DCE9FA" stroke="#4D8DFF" stroke-width="3"/><text x="523" y="206" font-family="Arial" font-size="19" font-weight="700" fill="#071827">Institutional data</text><text x="523" y="242" font-family="Arial" font-size="15" fill="#607487">Excess or unrelated</text><text x="523" y="267" font-family="Arial" font-size="15" fill="#607487">retrieval</text><path d="M708 410 H730" stroke="#18B7B2" stroke-width="5" marker-end="url(#r)"/>
<rect x="735" y="126" width="200" height="264" rx="22" fill="#FFF1D9" stroke="#F3B84B" stroke-width="3"/><text x="753" y="168" font-family="Arial" font-size="19" font-weight="700" fill="#071827">Connected tools</text><text x="753" y="204" font-family="Arial" font-size="15" fill="#607487">Send, change, upload,</text><text x="753" y="229" font-family="Arial" font-size="15" fill="#607487">schedule</text><path d="M938 410 H960" stroke="#18B7B2" stroke-width="5" marker-end="url(#r)"/>
<rect x="965" y="88" width="200" height="302" rx="22" fill="#FBE4E4" stroke="#D65B5B" stroke-width="3"/><text x="983" y="130" font-family="Arial" font-size="19" font-weight="700" fill="#071827">Autonomous agent</text><text x="983" y="166" font-family="Arial" font-size="15" fill="#607487">Several steps before</text><text x="983" y="191" font-family="Arial" font-size="15" fill="#607487">review</text><text x="60" y="470" font-family="Arial" font-size="17" fill="#607487">More access does not guarantee harm. It increases the consequences that a successful failure could reach.</text>
</svg>

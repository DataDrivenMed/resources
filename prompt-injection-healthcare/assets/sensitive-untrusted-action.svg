<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Sensitive data, untrusted content, and external action</title><desc id="desc">Three overlapping circles show the high-concern combination of sensitive data, untrusted content, and an external communication or action channel.</desc>
<rect width="1200" height="500" rx="28" fill="#FFFFFF"/>
<text x="60" y="65" font-family="Arial" font-size="26" font-weight="700" fill="#071827">The high-concern combination</text>
<circle cx="380" cy="280" r="150" fill="#4D8DFF" opacity=".24"/><circle cx="600" cy="280" r="150" fill="#F3B84B" opacity=".30"/><circle cx="820" cy="280" r="150" fill="#18B7B2" opacity=".28"/>
<text x="295" y="245" font-family="Arial" font-size="22" font-weight="700" fill="#071827">Sensitive data</text><text x="330" y="278" font-family="Arial" font-size="16" fill="#152637">PHI, research,</text><text x="330" y="302" font-family="Arial" font-size="16" fill="#152637">credentials, plans</text>
<text x="515" y="245" font-family="Arial" font-size="22" font-weight="700" fill="#071827">Untrusted content</text><text x="550" y="278" font-family="Arial" font-size="16" fill="#152637">PDF, email, web,</text><text x="550" y="302" font-family="Arial" font-size="16" fill="#152637">image, message</text>
<text x="750" y="245" font-family="Arial" font-size="22" font-weight="700" fill="#071827">External channel</text><text x="776" y="278" font-family="Arial" font-size="16" fill="#152637">Send, upload,</text><text x="776" y="302" font-family="Arial" font-size="16" fill="#152637">change, trigger</text>
<rect x="477" y="370" width="246" height="62" rx="31" fill="#071827"/><text x="518" y="409" font-family="Arial" font-size="20" font-weight="700" fill="#FFFFFF">Use stronger controls</text>
</svg>

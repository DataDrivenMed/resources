<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">User versus organizational responsibilities</title><desc id="desc">Two columns distinguish user actions from organizational architecture, governance, and incident response.</desc>
<rect width="1200" height="500" rx="28" fill="#FFFFFF"/>
<text x="60" y="62" font-family="Arial" font-size="26" font-weight="700" fill="#071827">Users PAUSE. Organizations design the boundaries.</text>
<rect x="55" y="105" width="520" height="340" rx="24" fill="#E9F7F6" stroke="#18B7B2" stroke-width="3"/>
<text x="95" y="160" font-family="Arial" font-size="24" font-weight="700" fill="#071827">User responsibilities</text>
<circle cx="105" cy="210" r="8" fill="#18B7B2"/><text x="128" y="216" font-family="Arial" font-size="16" fill="#152637">Use the approved product and account</text><circle cx="105" cy="253" r="8" fill="#18B7B2"/><text x="128" y="259" font-family="Arial" font-size="16" fill="#152637">Treat outside content as untrusted</text><circle cx="105" cy="296" r="8" fill="#18B7B2"/><text x="128" y="302" font-family="Arial" font-size="16" fill="#152637">Verify clinical and consequential output</text><circle cx="105" cy="339" r="8" fill="#18B7B2"/><text x="128" y="345" font-family="Arial" font-size="16" fill="#152637">Review data, recipient, and destination</text><circle cx="105" cy="382" r="8" fill="#18B7B2"/><text x="128" y="388" font-family="Arial" font-size="16" fill="#152637">Stop and report suspicious behavior</text>
<rect x="625" y="105" width="520" height="340" rx="24" fill="#EAF0FC" stroke="#4D8DFF" stroke-width="3"/><text x="665" y="160" font-family="Arial" font-size="24" font-weight="700" fill="#071827">Organizational responsibilities</text><circle cx="675" cy="210" r="8" fill="#4D8DFF"/><text x="698" y="216" font-family="Arial" font-size="16" fill="#152637">Inventory and classify AI workflows</text><circle cx="675" cy="253" r="8" fill="#4D8DFF"/><text x="698" y="259" font-family="Arial" font-size="16" fill="#152637">Apply least privilege and scoped retrieval</text><circle cx="675" cy="296" r="8" fill="#4D8DFF"/><text x="698" y="302" font-family="Arial" font-size="16" fill="#152637">Control tools, connectors, and identities</text><circle cx="675" cy="339" r="8" fill="#4D8DFF"/><text x="698" y="345" font-family="Arial" font-size="16" fill="#152637">Require approval, logging, and monitoring</text><circle cx="675" cy="382" r="8" fill="#4D8DFF"/><text x="698" y="388" font-family="Arial" font-size="16" fill="#152637">Test, respond, roll back, and reassess</text>
</svg>
